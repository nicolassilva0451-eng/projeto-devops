name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run 5 unit tests
        run: pytest -v
      - name: Build Docker image
        run: docker build -t meu-app .

  notify-on-failure:
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Alerta de falha
        run: echo "🚨 ALERTA: Workflow falhou! Verifique os logs no GitHub Actions."
