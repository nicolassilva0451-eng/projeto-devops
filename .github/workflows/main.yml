name: CI/CD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Build Docker image
        run: docker build -t meu-app.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy realizado com sucesso!"
