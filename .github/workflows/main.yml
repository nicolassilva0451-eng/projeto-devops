name: CI/CD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: pytest -v
      - name: Alerta Sucesso
        if: success()
        run: echo "ALERTA: Pipeline OK"
      - name: Alerta Falha
        if: failure()
        run: echo "ALERTA: Falha"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploy OK"
      - name: Alerta Deploy
        if: success()
        run: echo "ALERTA: Deploy realizado"
