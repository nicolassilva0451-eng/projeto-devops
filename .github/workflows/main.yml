name: CI/CD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -v
      - run: docker build -t meu-app.
      - name: Alerta sucesso build
        if: success()
        run: echo "ALERTA: Pipeline executada com sucesso"
      - name: Alerta falha build
        if: failure()
        run: echo "ALERTA CRITICO: Falha"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy OK"
      - name: Alerta deploy sucesso
        if: success()
        run: echo "ALERTA: Deploy realizado com sucesso"
